name: Jules Action
on:
  workflow_dispatch:
  issues:
    types: [labeled]
jobs:
  jules:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'bug' || github.event.label.name == 'jules'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - name: Invoke Jules
        uses: google-labs-code/jules-invoke@v1
        with:
          prompt: |
            Please solve the issue or perform the task requested.

            Title: ${{ github.event.issue.title || 'Manual workflow trigger' }}
            Context: ${{ github.event.issue.body || 'Manual workflow trigger' }}
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: 'main'
